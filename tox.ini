[tox]
requires = 
    tox-uv
runner = uv-venv-runner
basepython = python3.12
envlist =
    lint
    ty
    py315  # EoL: 2031-10
    py314  # EoL: 2030-10
    py313  # EoL: 2029-10
    py312  # EoL: 2028-10
    py311  # EoL: 2027-10
    py310  # EoL: 2026-10
    ; py39  # EoL: 2025-10
    ; py38  # EoL: 2024-10
    ; py37  # Eol: 2023-06-27
    coverage,
skip_missing_interpreters = true


# TOX Test Environment
[testenv]
; usedevelop = True
; extras =
; passenv = 
deps =
    benchman
    fabulist
    pydot
    pytest
    pytest-cov
    pytest-html
    rdflib
setenv =
    COVERAGE_FILE=.coverage.{envname}
commands =
    # See settings in pyproject.toml
    python -V
    ; uv pip install -e ../benchman
    pytest -ra -v -x --durations=10 --cov=nutree --html=build/pytest/report-{envname}.html --self-contained-html {posargs}

; [testenv:py38]
; commands =
;     # latest version of fabulist is not compatible with python 3.8
;     pip uninstall fabulist -y
;     {[testenv]commands}

[testenv:coverage]
skip_install = true
deps =
    coverage
setenv =
    COVERAGE_FILE = .coverage
commands =
    coverage erase
    coverage combine
    coverage html
    coverage report --fail-under=95.0


[testenv:lint]
skip_install = true
deps =
    ruff
commands =
    ruff -V
    ruff check nutree tests docs/jupyter
    ruff format --check nutree tests docs/jupyter


[testenv:format]
description = Reformat python code using ruff (Black, isort, and pyupgrade)
skip_install = true
deps =
    ruff
changedir = {toxinidir}
commands =
    ruff check --fix nutree tests docs/jupyter
    ruff format nutree tests docs/jupyter
    {[testenv:lint]commands}


[testenv:ty]
skip_install = true
allowlist_externals =
    env
    uv
changedir = {toxinidir}
commands =
    env -u VIRTUAL_ENV uv run ty check
ignore_outcome = true


[testenv:docs]
description = Build Sphinx documentation (output directory: docs/sphinx-build)
deps =
    furo
    fabulist
    # pandoc # for jupyter notebook RST conversion
    pydot
    rdflib
    sphinx
    sphinx_rtd_theme
    myst-parser[linkify]
    sphinxcontrib-googleanalytics
    sphinxcontrib-mermaid
allowlist_externals =
    jupyter
changedir = docs
commands =
    ; jupyter nbconvert --to rst --output-dir sphinx jupyter/take_the_tour.ipynb
    jupyter nbconvert --to markdown --output-dir sphinx jupyter/take_the_tour.ipynb
    ; jupyter nbconvert --execute --to rst --output-dir sphinx jupyter/take_the_tour.ipynb
    # http://www.sphinx-doc.org/en/master/man/sphinx-build.html
    sphinx-build -b html sphinx sphinx-build

; [testenv:benchmarks]
; description = Run 'pytest --benchmarks' on all Python versions
; ; envlist = py38, py39, py310, py311, py312
; skip_install = true
; changedir = {toxinidir}
; basepython = py312
; ; basepython = py39
; ; basepython = py{38, 39}
; deps =
;     pytest
;     pytest-benchmark[histogram]
; commands =
;     python -V
;     ; pytest -k test_bench -o addopts="" --benchmarks 
;     ; pytest  -o addopts="" -k test_pybench --benchmarks --benchmark-histogram
;     pytest -o addopts="" -k test_pybench --benchmarks 
;     benchman purge
