# Tag-driven release pipeline.
#
# Trigger: push a tag matching v* (e.g. v1.2.0 or v1.2.0rc1).
#
# Steps:
#   1. validate  – verify the tag version matches pyproject.toml and run lint + tests.
#   2. build     – build sdist and wheel; upload as a workflow artifact.
#   3. github-release – create / update the GitHub Release and attach the artifacts.
#   4. pypi-publish  – publish to PyPI via Trusted Publisher (OIDC, no API token).
#   5. post-release-bump – open a PR that bumps source to the next patch .dev1 version.
#
# Prerequisites:
#   PyPI Trusted Publisher must be configured on pypi.org for this repo:
#     Publisher: GitHub Actions
#     Repository owner: mar10
#     Repository name: nutree
#     Workflow filename: release.yml
#     Environment name: pypi

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read  # overridden per job where needed

jobs:

  # ---------------------------------------------------------------------------
  validate:
    name: Validate tag and run quality checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Determine if this is a pre-release (contains a/b/rc suffix)
          if echo "$VERSION" | grep -qE '(a|b|rc)[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag/source version match
        run: |
          PKG_VERSION=$(uv version --short)
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION but pyproject.toml has version='$PKG_VERSION'"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Install system dependencies
        run: sudo apt-get install -y graphviz

      - name: Run lint
        run: uvx --with tox-uv tox -e lint

      - name: Run tests (primary Python)
        run: uvx --with tox-uv tox -e py312

    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}

  # ---------------------------------------------------------------------------
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build]
    permissions:
      contents: write  # required to create releases and upload assets

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ needs.validate.outputs.version }}"
          prerelease: ${{ needs.validate.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*

  # ---------------------------------------------------------------------------
  pypi-publish:
    name: Publish to PyPI (Trusted Publisher)
    runs-on: ubuntu-latest
    needs: [validate, build]
    permissions:
      id-token: write  # required for OIDC token exchange with PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/nutree/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------------------
  post-release-bump:
    name: Open post-release version bump PR
    runs-on: ubuntu-latest
    needs: [validate, github-release, pypi-publish]
    permissions:
      contents: write        # push bump branch
      pull-requests: write   # open PR

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Use a PAT if your repo has branch protection rules that block GITHUB_TOKEN pushes.
          # token: ${{ secrets.RELEASE_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute next dev version (next patch .dev1)
        id: bump
        run: |
          RELEASED="${{ needs.validate.outputs.version }}"

          # Normalize project version to the released tag value first,
          # then derive next development version in a deterministic way.
          uv version "$RELEASED" --frozen
          uv version --bump patch --bump dev --frozen

          NEXT_DEV=$(uv version --short)
          echo "Bumped $RELEASED -> $NEXT_DEV"
          echo "current=$RELEASED" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT_DEV" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: "post-release/v${{ steps.bump.outputs.next }}"
          commit-message: "Bump version to ${{ steps.bump.outputs.next }} [ci skip]"
          title: "Post-release: bump version to ${{ steps.bump.outputs.next }}"
          body: |
            Automated post-release version bump.

            - Released: `${{ steps.bump.outputs.current }}`
            - Next dev: `${{ steps.bump.outputs.next }}`

            Merge once the release is confirmed complete.
          labels: release
